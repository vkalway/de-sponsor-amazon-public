<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to De-Sponsor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 20px;
            line-height: 1.5;
            color: #333;
            text-align: center;
        }
        
        .logo {
            width: 64px;
            height: 64px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 6px;
            color: #111;
        }

        .hero-text {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            text-align: left;
        }

        .card {
            background: #f8f9fa;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 25px;
        }

        .card h3 {
            margin-top: 0;
            color: #1a73e8;
        }

        .pin-instruction {
            background: #fffdf5;
            border: 2px dashed #f2c744;
            border-radius: 12px;
            padding: 10px 10px;
            margin-top: 12px;
            text-align: left;
        }

        .pin-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 12px;
        }

        .pin-row .pin-instruction {
            flex: 1;
            margin-top: 0;
        }

        .pin-row .pin-image {
            flex: 1;
            max-width: 50%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .button {
            display: inline-block;
            background: #232f3e; /* Amazon Dark Blue */
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 12px;
        }
        
        .button:hover {
            background: #131a22;
        }

        /* Pin Icon Helper */
        .pin-icon {
            display: inline-block;
            vertical-align: middle;
            width: 20px;
            height: 20px;
            background-color: #5f6368;
            mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16,12V4H17V2H7V4H8V12L6,14V16H11.2V22H12.8V16H18V14L16,12Z"/></svg>') no-repeat center;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16,12V4H17V2H7V4H8V12L6,14V16H11.2V22H12.8V16H18V14L16,12Z"/></svg>') no-repeat center;
        }
    </style>
</head>
<body>

    <img src="icons/icon128.png" alt="Logo" class="logo">
    
    <h1>De-Sponsor for Amazon is active.</h1>

    <div class="pin-row">
        <div class="pin-instruction">
            <h3 style="color:#333; margin: 0 0 6px 0;">One last step: Pin the Extension</h3>
            <p style="margin: 0 0 6px 0;">To easily toggle the blocker on/off, do the following:</p>
            
            <div style="font-size: 16px;">
                1. Click the <strong>Puzzle Piece</strong> <span style="font-size:18px">🧩</span> icon in your browser top right.<br>
                2. Find <strong>De-Sponsor for Amazon</strong> in the list. Click the <strong>Pushpin</strong> <span class="pin-icon"></span> icon.
            </div>
        </div>

        <img src="Pin_extension.png" alt="How to pin the extension" class="pin-image">
    </div>

    <a href="https://www.amazon.com/s?k=coffee+maker" target="_blank" class="button">Try it now: Search for "Coffee Maker"</a>

</body>
</html>
